name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lumenboard-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
  ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
  DOCKERHUB_SECRET_ARN: ${{ vars.DOCKERHUB_SECRET_ARN }}
  IMAGE_NAME: ${{ vars.DOCKERHUB_NAMESPACE }}/lumenboard

jobs:
  quality:
    name: Lint, test, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

  deploy:
    name: Build, push, and deploy to ECS
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment variables
        shell: bash
        run: |
          required=(AWS_REGION ECS_CLUSTER ECS_SERVICE ECS_TASK_FAMILY CONTAINER_NAME ECS_TASK_EXECUTION_ROLE_ARN DOCKERHUB_SECRET_ARN DOCKERHUB_NAMESPACE)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository variable $name is missing."
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare task definition
        shell: bash
        run: |
          jq \
            --arg executionRoleArn "$ECS_TASK_EXECUTION_ROLE_ARN" \
            --arg secretArn "$DOCKERHUB_SECRET_ARN" \
            --arg region "$AWS_REGION" \
            --arg containerName "$CONTAINER_NAME" \
            --arg family "$ECS_TASK_FAMILY" \
            '.family = $family
             | .executionRoleArn = $executionRoleArn
             | .containerDefinitions |= map(
                 if .name == $containerName then
                   .repositoryCredentials.credentialsParameter = $secretArn
                   | .logConfiguration.options["awslogs-region"] = $region
                 else
                   .
                 end
               )' \
            task-definition.json > task-definition.rendered.json

      - name: Set the exact commit image on the task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.rendered.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy and wait for service stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
